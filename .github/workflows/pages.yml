# 演示站的数据是真二进制跑出来的快照，所以这条流水线必须先编译再导出。
# 定时那一档是给日期保鲜的：快照里的到期天数按导出当天算，久不重建就会显得陈旧。
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'site/**'
      - 'scripts/demo-seed.py'
      - 'scripts/build-pages.py'
      - 'scripts/outdir.py'
      - '.github/workflows/pages.yml'
      - 'src/**'          # 快照由后端产出，引擎变了就得重导
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  # 公开仓库 60 天没有活动，GitHub 会停掉这条定时（停之前发邮件），停了要到 Actions 页手动启用；
  # 不做保活。快照是静态的，页里的天数不会漂，横幅也写着生成日期，旧了只是日期显得早
  schedule:
    - cron: '0 3 1 * *'   # 每月 1 日重建，让演示里的到期天数保持新鲜
  workflow_dispatch:

# 默认只读；发布用的写权限与 OIDC 令牌只给 deploy，跑编译与脚本的 build 拿不到
permissions:
  contents: read

# 同时只留一次部署，排队的旧任务直接让位
concurrency:
  group: pages
  cancel-in-progress: true

# 升级都是显式动作：action 钉 commit SHA、行尾注明版本（tag 被挪到别的提交也换不掉这里跑的代码），
# runner 钉 ubuntu-24.04（ubuntu-latest 换代时工具链与产物的依赖跟着变）
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read           # configure-pages 要读站点配置
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pages-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked
      - name: Seed and export the demo snapshot
        run: python3 scripts/demo-seed.py --bin target/release/kalends --out site/demo-data.js
      - run: python3 scripts/build-pages.py --out dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        # .nojekyll 是点文件，v4 起默认不打包
        with: { path: dist, include-hidden-files: true }

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1