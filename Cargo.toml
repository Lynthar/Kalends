[package]
name = "kalends"
version = "0.2.0"
edition = "2021"
description = "Self-hosted, local-first tracker for subscriptions, SIM keep-alives, VPS renewals and anything else with a next date"
license = "AGPL-3.0-only"
repository = "https://github.com/Lynthar/Kalends"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

[dev-dependencies]
# 只为中间件的 oneshot 测试（PIN 门接线）；tower 本就是 axum 的底座，不引入新家族
tower = { version = "0.5", features = ["util"] }
# 只给测试造一次性数据目录（迁移前快照与 restore 都要真实文件路径）
tempfile = "3"

# 每条规则接进来时全仓零命中；有命中的先修掉再接，不用 allow 压——压掉的门等于没有门
[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

# 从 clippy::pedantic 里挑的：留下的都能在本 crate 打到，且每条现在都是绿的
[lints.clippy]
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
cloned_instead_of_copied = "deny"
collapsible_else_if = "deny"
